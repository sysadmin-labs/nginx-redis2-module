# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered
#
# Needs a Redis server on 127.0.0.1:6379.

RELOAD_HTTP=""

RELOAD_SERVER="
        location /probe {
            redis2_query ping;
            redis2_pass 127.0.0.1:6379;
        }"

# A reload that lost the module would leave this location without a content
# handler and answer 404, and one that lost the upstream connection would
# answer 502.  Either way the probe prints nothing and the round fails, so
# what is checked is the module doing its work and not the server being up.
RELOAD_EXPECT='+PONG'

reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe" | tr -d '\r\n'
}
